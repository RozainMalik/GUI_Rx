[project]
name = "annotator"
version = "1.0.0"
description = "GUI-grounding annotation pipeline (screenshots -> MedSPOT click data) driven by Qwen3.5-9B"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["annotator*"]
