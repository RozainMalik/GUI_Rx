[project]
name = "oai-annotator"
version = "0.1.0"
description = "OpenAI-API variant of the GUI-grounding annotation pipeline: graded batches with hard cost caps"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["oai*"]
